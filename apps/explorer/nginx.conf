server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to the api service so the SPA can use same-origin paths.
  location /v1/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
    proxy_buffering off;      # required for SSE (/v1/explorer/stream)
    proxy_read_timeout 3600s;
  }

  location /metrics {
    proxy_pass http://api:3000;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
