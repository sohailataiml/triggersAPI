# Render Blueprint for TriggersAPI.
#
# Apply it from the Render dashboard: New -> Blueprint -> pick this repo/branch.
# Render provisions everything below and wires the env vars via references.
#
# Free tier is used throughout for a demo. Notes:
#   - Free PostgreSQL is deleted by Render after ~30 days.
#   - Free web services spin down when idle (~50s cold start on next request).
# Bump each `plan: free` to `starter` for always-on, durable infrastructure.
#
# After the first deploy:
#   1. The API applies migrations automatically on boot (`pnpm db:deploy`).
#   2. Seed demo tokens once: open the API service Shell in Render and run
#        pnpm db:seed
#      Copy the printed ADMIN / PRODUCER / CONSUMER tokens.
#   3. Open the Explorer URL, click Settings, set "API base" to the API's URL
#      (https://triggers-api.onrender.com), and paste the tokens.
#   4. If the API's CORS_ORIGINS default below doesn't match the Explorer's
#      actual URL, update it on the triggers-api service and redeploy.

databases:
  - name: triggers-postgres
    plan: free
    region: oregon
    databaseName: triggers
    user: triggers

services:
  # --- Redis-compatible coordination store (Pub/Sub + Explorer SSE streams) ---
  - type: keyvalue
    name: triggers-redis
    plan: free
    region: oregon
    ipAllowList: [] # internal connections only

  # --- API (Fastify). Runs migrations on boot, then serves /v1 + SSE. ---
  - type: web
    name: triggers-api
    runtime: docker
    repo: https://github.com/sohailataiml/triggersAPI
    branch: explorer-redesign
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: triggers-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: triggers-redis
          property: connectionString
      - key: API_KEY_PEPPER
        generateValue: true
      - key: LEASE_TOKEN_SECRET
        generateValue: true
      # Cross-origin: the static Explorer calls this API directly. Set this to
      # the Explorer's real URL after the first deploy if it differs.
      - key: CORS_ORIGINS
        value: https://triggers-explorer.onrender.com

  # --- Worker (BullMQ): recovers expired leases on a schedule. ---
  - type: worker
    name: triggers-worker
    runtime: docker
    repo: https://github.com/sohailataiml/triggersAPI
    branch: explorer-redesign
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: triggers-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: triggers-redis
          property: connectionString
      # Share the API's generated secrets so both processes agree.
      - key: API_KEY_PEPPER
        fromService:
          type: web
          name: triggers-api
          envVarKey: API_KEY_PEPPER
      - key: LEASE_TOKEN_SECRET
        fromService:
          type: web
          name: triggers-api
          envVarKey: LEASE_TOKEN_SECRET

  # --- MCP server: exposes the API to AI agents over the Model Context
  #     Protocol (Streamable HTTP at /mcp). Talks to the API over HTTP only,
  #     so it needs no database or Redis access.
  #
  #     Defaults to `header` auth mode: each client supplies its own Triggers
  #     keys via X-Triggers-{Admin,Producer,Consumer}-Token headers and this
  #     service stores none. To instead lend the service's own keys behind a
  #     single gateway secret, set MCP_HTTP_AUTH_MODE=shared, generate
  #     MCP_HTTP_AUTH_TOKEN, and add the seeded TRIGGERS_*_TOKEN values.
  - type: web
    name: triggers-mcp
    runtime: docker
    repo: https://github.com/sohailataiml/triggersAPI
    branch: explorer-redesign
    dockerfilePath: ./apps/mcp/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MCP_HTTP_PORT
        value: 3100
      - key: LOG_LEVEL
        value: info
      # Must be a full URL with a scheme (validated at startup). Update this if
      # the API service resolves to a different hostname after the first deploy.
      - key: TRIGGERS_API_URL
        value: https://triggers-api.onrender.com
      - key: MCP_HTTP_AUTH_MODE
        value: header

  # --- Zapier AI Automation Copilot: an MCP client that operates the platform
  #     in natural language. Serves its own SPA, so the browser is same-origin
  #     with the agent API and no credential crosses an origin boundary.
  #
  #     Set ANTHROPIC_API_KEY and the seeded TRIGGERS_*_TOKEN values in the
  #     Render dashboard (marked sync:false so they are never in source). The
  #     Copilot forwards those tokens to the MCP server as X-Triggers-* headers;
  #     without them it serves its setup screen instead of a broken chat box.
  - type: web
    name: triggers-copilot
    runtime: docker
    repo: https://github.com/sohailataiml/triggersAPI
    branch: explorer-redesign
    dockerfilePath: ./apps/copilot/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /copilot/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COPILOT_PORT
        value: 3200
      - key: LOG_LEVEL
        value: info
      - key: COPILOT_MODEL
        value: claude-opus-5
      - key: COPILOT_EFFORT
        value: medium
      - key: MCP_SERVER_URL
        value: https://triggers-mcp.onrender.com/mcp
      - key: TRIGGERS_API_URL
        value: https://triggers-api.onrender.com
      - key: EXPLORER_URL
        value: https://triggers-explorer.onrender.com
      # Secrets — set these in the dashboard, never in this file.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TRIGGERS_ADMIN_TOKEN
        sync: false
      - key: TRIGGERS_PRODUCER_TOKEN
        sync: false
      - key: TRIGGERS_CONSUMER_TOKEN
        sync: false

  # --- Explorer (Vite static site). The browser calls the API cross-origin;
  #     set "API base" in the app's Settings to the API URL after deploy. ---
  - type: web
    name: triggers-explorer
    runtime: static
    repo: https://github.com/sohailataiml/triggersAPI
    branch: explorer-redesign
    # Render's static-site builder already provides pnpm (do NOT run
    # `corepack enable` here — it fails with EROFS on the read-only image).
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @triggers/explorer build
    staticPublishPath: apps/explorer/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
